[project]
name = "fastdrs"
version = "0.1.3"
description = "Diabetic retinopathy screening toolkit"
readme = "package/README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

authors = [
    { name = "Michael Mukiibi" }
]

dependencies = [
    "numpy",
    "pillow",
]

[project.optional-dependencies]

training = [
    "torch",
    "torchvision",
    "datasets",
    "scikit-learn",
    "opencv-python",
    "wandb"
]

export = [
    "litert_torch",
]

[dependency-groups]

dev = [
    "pytest>=8",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fastdrs"]