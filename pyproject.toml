[project]
name = "fastdrs"
version = "0.1.15"
description = "Diabetic retinopathy screening toolkit"
readme = "package/README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

authors = [
    { name = "Michael Mukiibi" }
]

dependencies = [
    "numpy",
    "opencv-python-headless>=5.0.0.93",
    "pillow",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "typer>=0.27.1",
]

[project.optional-dependencies]

training = [
    "torch",
    "torchvision",
    "datasets",
    "scikit-learn",
    "opencv-python",
    "wandb"
]

inference = [
    "pillow",
    "numpy",
]

litert = [
    "litert_torch",
]

[project.scripts]
fastdrs = "fastdrs.cli.main:app"

[dependency-groups]

dev = [
    "pytest>=8",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cpu"

[tool.hatch.build.targets.wheel]
packages = ["src/fastdrs"]
