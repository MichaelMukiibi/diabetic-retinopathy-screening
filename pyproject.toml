[project]
name = "fastdrs"
version = "0.1.0"
description = "Diabetic retinopathy screening and model deployment toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Michael Mukiibi" }
]

dependencies = [
    "torch",
    "torchvision",
    "numpy",
    "pillow",
    "opencv-python",
    "scikit-learn",
    "datasets",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fastdrs"]